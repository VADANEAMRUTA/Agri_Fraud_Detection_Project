<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | AgriGuard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .access-denied {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
        }
        .access-card {
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .access-icon {
            font-size: 64px;
            color: #dc3545;
            margin-bottom: 20px;
        }
        h1 {
            color: #dc3545;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin: 5px;
        }
        .btn-admin {
            background-color: #28a745;
        }
    </style>
</head>
<body>
    <div class="access-denied">
        <div class="access-card">
            <div class="access-icon">🔒</div>
            <h1>Admin Access Required</h1>
            <p>You do not have administrator privileges to access this page. This area is restricted to authorized personnel only.</p>
            <p>If you believe this is an error, please contact the system administrator or login with an admin account.</p>
            <div>
                <a href="{{ url_for('admin_login') }}" class="btn btn-admin">Admin Login</a>
                <a href="{{ url_for('login_selector') }}" class="btn">Back to Login</a>
                <a href="{{ url_for('home') }}" class="btn">Home</a>
            </div>
        </div>
    </div>
</body>
</html>
