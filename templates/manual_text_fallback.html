{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>OCR Text Extraction Failed</h2>
    <p>The system couldn't extract text automatically from your image.</p>
    
    <div class="row">
        <div class="col-md-6">
            <h4>Uploaded Image:</h4>
            <img src="{{ url_for('static', filename='uploads/' + image.split('/')[-1]) }}" 
                 class="img-fluid" alt="Uploaded image">
        </div>
        <div class="col-md-6">
            <h4>Manual Text Entry:</h4>
            <form action="/check_text" method="post">
                <div class="mb-3">
                    <label class="form-label">Enter the text from the image:</label>
                    <textarea class="form-control" name="text" rows="10" 
                              placeholder="Type the text visible in the image..."></textarea>
                </div>
                <input type="hidden" name="image_path" value="{{ image }}">
                <button type="submit" class="btn btn-primary">Check for Fraud</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
