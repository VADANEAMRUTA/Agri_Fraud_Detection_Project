<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - AgriGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #2e7d32; --secondary-color: #4caf50; }
        .error-container { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .error-content { text-align: center; max-width: 600px; }
        .error-code { font-size: 8rem; font-weight: 800; color: var(--primary-color); line-height: 1; }
        .error-title { font-size: 2.5rem; font-weight: 700; margin-bottom: 20px; }
        .home-button { background: var(--primary-color); color: white; padding: 12px 30px; border-radius: 8px; text-decoration: none; }
        .home-button:hover { background: var(--secondary-color); color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark" style="background-color: var(--primary-color);">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-shield-alt"></i> AgriGuard</a>
        </div>
    </nav>
    <div class="error-container">
        <div class="error-content">
            <div class="error-code">500</div>
            <h1 class="error-title">Server Error</h1>
            <p class="error-message">Something went wrong on our end. Please try again later.</p>
            <a href="/" class="home-button"><i class="fas fa-home me-2"></i>Back to Home</a>
        </div>
    </div>
    <footer class="footer mt-5 py-4" style="background-color: var(--primary-color); color: white;">
        <div class="container text-center">
            <p>&copy; 2024 AgriGuard Fraud Detection System</p>
        </div>
    </footer>
</body>
</html>
